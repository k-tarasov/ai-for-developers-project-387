name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configure git auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global credential.helper '!f() { echo "username=x-access-token"; echo "password=$GITHUB_TOKEN"; }; f'

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            Строго следуй команде пользователя в комментарии-триггере. Это единственный источник задачи.

            Правила:
            - Если в команде сказано оценить сложность, описать план или ответить на вопрос — НЕ вноси изменения в код, НЕ коммить, НЕ пуши, НЕ открывай PR. Ответь комментарием.
            - Если в команде есть явный запрет («не реализуй», «не применяй изменения», «не делай» и т.п.) — не выполняй запрещённое действие, даже если в issue/PR описана фича.
            - Реализуй и меняй код только если команда явно просит это сделать («реализуй», «сделай», «внеси изменения», «исправь», «добавь» и т.п.).
            - Не выдумывай задачи из контекста issue/PR: не превращай описание фичи в задачу, если пользователь не просил её реализовать.
            - Контекст issue/PR используй только как дополнительную информацию для ответа на команду.