name: Implement from Issue (opencode)

on:
  issue_comment:
    types: [created]

jobs:
  implement:
    if: contains(github.event.comment.body, '/implement')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run OpenCode (implement)
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode/big-pickle' }}
          use_github_token: true
          mentions: /implement
          prompt: |
            Реализуй задачу из этого issue и открой pull request.

            Правила:
            - Следуй AGENTS.md репозитория: команды через Makefile, коммиты в стиле Conventional Commits, не смешивай правки frontend и backend без необходимости.
            - Имена веток — стабильные: `agent/<issue-number>-<slug>`. Если ветка уже существует — работай в ней, НЕ создавай дублирующий PR.
            - Описание PR должно содержать `Closes #<issue-number>`.
            - Перед завершением прогони проверки: lint, тесты, сборку (по Makefile).