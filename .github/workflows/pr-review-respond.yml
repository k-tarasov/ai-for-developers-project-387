name: PR Review Respond (opencode)

on:
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

jobs:
  review-fix:
    if: contains(github.event.comment.body, '/review-fix')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configure git auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global credential.helper '!f() { echo "username=x-access-token"; echo "password=$GITHUB_TOKEN"; }; f'

      - name: Run OpenCode (review-fix)
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode/big-pickle' }}
          use_github_token: true
          mentions: /review-fix
          prompt: |
            Внеси правки по замечаниям ревью в существующий pull request.

            Правила:
            - Проанализируй все комментарии ревью в этом PR (включая комментарии на конкретные строки кода).
            - Вноси изменения в ветку этого же PR — НЕ создавай новый PR.
            - Следуй AGENTS.md репозитория: команды через Makefile, коммиты в стиле Conventional Commits.
            - После правок прогони проверки: lint, тесты, сборку (по Makefile).
            - Если открытого PR для этой задачи нет — сообщи об этом в комментарии и НЕ выполняй изменений.